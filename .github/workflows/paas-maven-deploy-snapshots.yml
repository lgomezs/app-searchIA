name: paas-maven-deploy-snapshots

on:
  workflow_dispatch:
    inputs:
      SUPRAENVS:
        description: "entornos destino (des/pre)"
        required: true
        type: string

      ENVS:
        description: "Entornos destino"
        required: true
        type: string

      PR_NUMBER:
        description: "Pull Request Number"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  pull-requests: write
  issues: write
  id-token: write

env:
  JAVA_VERSION: '21'
  IMAGE_NAME: lgomezs/app-searchia
  REGISTRY: ${{ secrets.REGISTRY_URL }}
  AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
  AKS_CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME }}
  AKS_NAMESPACE: ${{ vars.AKS_NAMESPACE }}
  AKS_DEPLOYMENT_NAME: ${{ vars.AKS_DEPLOYMENT_NAME }}
  AKS_CONTAINER_NAME: ${{ vars.AKS_CONTAINER_NAME }}

jobs:
  deploy-snapshot:
    name: Build & Publish Snapshot Image
    runs-on: ubuntu-latest

    if: contains(inputs.SUPRAENVS, 'des') || contains(inputs.SUPRAENVS, 'pre')

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print workflow inputs
        run: |
          echo "SUPRAENVS=${{ inputs.SUPRAENVS }}"
          echo "ENVS=${{ inputs.ENVS }}"
          echo "PR_NUMBER=${{ inputs.PR_NUMBER }}"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Verify Maven installation
        run: mvn -version

      - name: Validate snapshot version
        run: |
          VERSION=$(mvn help:evaluate \
            -Dexpression=project.version \
            -q \
            -DforceStdout)

          echo "Detected version: $VERSION"

          if [[ "$VERSION" != *"-SNAPSHOT" ]]; then
            echo "ERROR: Este workflow solo soporta versiones SNAPSHOT"
            exit 1
          fi

      - name: Build Quarkus application
        run: mvn clean package -DskipTests

      - name: Validate Dockerfile.jvm exists
        working-directory: boot
        run: |
          if [ ! -f src/main/docker/Dockerfile.jvm ]; then
            echo "ERROR: No existe src/main/docker/Dockerfile.jvm"
            exit 1
          fi

          echo "Dockerfile.jvm encontrado correctamente"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        working-directory: boot
        run: |
          docker buildx build \
          --platform linux/arm64 \
          -f src/main/docker/Dockerfile.jvm \
          -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
          --load \
          .      

      - name: Login to DockerHub
        env:
          DP_USERNAME: ${{ secrets.DP_USERNAME }}
          DP_PASSWORD: ${{ secrets.DP_PASSWORD }}
        run: |
          echo "${DP_PASSWORD}" | docker login \
            -u "${DP_USERNAME}" \
            --password-stdin

      - name: Tag Docker image
        run: |
          docker tag \
            ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Publish Docker image
        run: |
          docker push \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure Login
        run: |
          az account show

          az aks show \
            --resource-group ${{ env.AKS_RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }} \
            --query "{name:name,state:provisioningState}" \
            -o table

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}

      - name: Deploy image to AKS
        run: |
          sed -e "s|__AKS_NAMESPACE__|${{ env.AKS_NAMESPACE }}|g" \
            k8s/namespace.yaml > /tmp/namespace.yaml

          sed -e "s|__AKS_NAMESPACE__|${{ env.AKS_NAMESPACE }}|g" \
              -e "s|__AKS_DEPLOYMENT_NAME__|${{ env.AKS_DEPLOYMENT_NAME }}|g" \
              -e "s|__AZURE_SEARCH_API_KEY__|${{ secrets.AZURE_SEARCH_API_KEY }}|g" \
              -e "s|__AZURE_OPENAI_API_KEY__|${{ secrets.AZURE_OPENAI_API_KEY }}|g" \
            k8s/secret.yaml > /tmp/secret.yaml

          sed -e "s|__AKS_NAMESPACE__|${{ env.AKS_NAMESPACE }}|g" \
              -e "s|__AKS_DEPLOYMENT_NAME__|${{ env.AKS_DEPLOYMENT_NAME }}|g" \
              -e "s|__AKS_CONTAINER_NAME__|${{ env.AKS_CONTAINER_NAME }}|g" \
              -e "s|__IMAGE__|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g" \
            k8s/deployment.yaml > /tmp/deployment.yaml

          sed -e "s|__AKS_NAMESPACE__|${{ env.AKS_NAMESPACE }}|g" \
              -e "s|__AKS_DEPLOYMENT_NAME__|${{ env.AKS_DEPLOYMENT_NAME }}|g" \
            k8s/service.yaml > /tmp/service.yaml

          kubectl apply -f /tmp/namespace.yaml
          kubectl apply -f /tmp/secret.yaml
          kubectl apply -f /tmp/deployment.yaml
          kubectl apply -f /tmp/service.yaml

          kubectl rollout status deployment/${{ env.AKS_DEPLOYMENT_NAME }} \
            --namespace ${{ env.AKS_NAMESPACE }}

      - name: Deployment summary
        run: |
          echo "Deploy snapshot completado"
          echo "SUPRAENVS=${{ inputs.SUPRAENVS }}"
          echo "ENVS=${{ inputs.ENVS }}"
          echo "IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "AKS_CLUSTER=${{ env.AKS_CLUSTER_NAME }}"
          echo "AKS_NAMESPACE=${{ env.AKS_NAMESPACE }}"
          echo "AKS_DEPLOYMENT=${{ env.AKS_DEPLOYMENT_NAME }}"

      - name: Comment PR Success
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ inputs.PR_NUMBER }}'),
              body: `
              ✅ Deploy completado correctamente

              Environment:
              - SUPRAENVS: ${{ inputs.SUPRAENVS }}
              - ENVS: ${{ inputs.ENVS }}

              Docker Image:
              \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}\`

              AKS Deployment:
              - Cluster: ${{ env.AKS_CLUSTER_NAME }}
              - Namespace: ${{ env.AKS_NAMESPACE }}
              - Deployment: ${{ env.AKS_DEPLOYMENT_NAME }}
              `
            })

      - name: Comment PR Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ inputs.PR_NUMBER }}'),
              body: `
              ❌ Deploy falló

              Revisar workflow:
              https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}
              `
            })