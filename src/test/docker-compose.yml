services:
  postgres:
    image: postgres:15
    container_name: postgres-admin-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - "./postgres/scripts:/docker-entrypoint-initdb.d"
      #- postgres_data:/var/lib/postgresql/data

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda
    command:
      - redpanda start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092,OUTSIDE://localhost:9092
      - --pandaproxy-addr=0.0.0.0:8082
    ports:
      - "9092:19092"   # Kafka broker para Windows
      - "8081:8080"    # Redpanda Console
      - "8082:8082"    # Pandaproxy (opcional)
    volumes:
      - redpanda:/var/lib/redpanda/data
    environment:
      - REDPANDA_AUTO_CREATE_TOPICS=orders:1:1
volumes:
  postgres_data: {}
  pgdata: { }
  redpanda: { }
